; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266

[env:esp8266]
; Pinned so builds stay reproducible; bump deliberately.
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino

; --- Build ---
board_build.f_cpu = 160000000L     ; faster SWD bit-banging
board_build.filesystem = littlefs
; nodemcuv2 defaults to eagle.flash.4m1m.ld (4MB flash / 1MB filesystem).
; Uncomment to give the filesystem 2MB or none at all:
; board_build.ldscript = eagle.flash.4m2m.ld
; board_build.ldscript = eagle.flash.4m.ld
build_flags =
    -D SERIAL_BAUD=460800
; Web UI access point (see src/web.h). Default: open network "MM32-Flasher-XXXX".
;   -D WIFI_AP_PASS=\"mm32flash\"      ; 8..63 characters
;   -D WIFI_AP_SSID=\"Line3-Flasher\"
;   -D MDNS_HOSTNAME=\"mm32-flasher\"  ; http://mm32-flasher.local
extra_scripts = pre:tools/embed_web.py   ; web/index.html -> src/web_page.h

; --- Upload ---
upload_speed = 921600
; upload_port = COM3               ; set if auto-detection picks the wrong port

; --- Serial monitor ---
monitor_speed = 460800
monitor_filters = esp8266_exception_decoder, time, default

; --- Libraries ---
lib_deps =
